services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nodeva
      POSTGRES_PASSWORD: nodeva_dev
      POSTGRES_DB: nodeva
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeva"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

volumes:
  pgdata:
