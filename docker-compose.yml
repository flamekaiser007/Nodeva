services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nodeva
      POSTGRES_PASSWORD: nodeva_dev
      POSTGRES_DB: nodeva
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeva"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Used by backend/src/ws/clusterRelay.js for cross-instance Hub routing --
  # set REDIS_URL=redis://localhost:6380 to enable it locally. Off by
  # default (unset REDIS_URL): the single-instance deployment this MVP
  # actually runs never touches this service at all.
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Alerting on the metrics observability/metrics.js already exposes (see
  # alerting/alert_rules.yml). Both services are gated behind the
  # `observability` profile -- `docker compose up` never starts them;
  # `docker compose --profile observability up -d prometheus alertmanager`
  # does. Off by default for the same reason `redis` is: nothing in the
  # single-instance dev/test path needs it running.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./alerting/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    ports: ["9093:9093"]
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]

  # Log aggregation (observability/lokiSink.js): the backend ships its
  # structured JSON lines here directly over Loki's HTTP push API when
  # LOKI_URL is set (off by default, same posture as everything else in
  # this profile). The stock image's baked-in default config
  # (/etc/loki/local-config.yaml, filesystem storage) is enough for local
  # dev -- no mounted config needed, unlike prometheus/alertmanager above.
  loki:
    image: grafana/loki:2.9.10
    profiles: ["observability"]
    ports: ["3300:3100"] # host 3300, not 3100 -- the backend itself already owns 3100 locally

volumes:
  pgdata:
