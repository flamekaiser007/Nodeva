# Dev-only Prometheus config for the observability compose profile (see
# docker-compose.yml's `prometheus` service, `profiles: [observability]` --
# off by default, opt in with `docker compose --profile observability up`).
#
# `host.docker.internal` is Docker Desktop's (Mac/Windows) name for "the
# machine running Docker" -- this backend is started directly with `node
# src/index.js` (see scripts/e2e_demo.sh, scripts/p2p_demo.sh), not as a
# compose service itself, so Prometheus (which IS a compose service, on
# its own container network) reaches it the same way any other tool on
# this machine would: via the host's own port. On native Linux Docker,
# replace this with the host's actual LAN/bridge IP.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nodeva-backend
    scheme: http
    # Matches api/server.js's `requireAdminToken` middleware on GET
    # /metrics -- Prometheus's own `bearer_token` scrape option authenticates
    # exactly like any other client of that route (see that middleware's own
    # file header for why ADMIN_TOKEN, not a normal user JWT). This value is
    # a fixed LOCAL DEV DEMO token, not a secret -- see the observability
    # profile's docs in README.md before ever pointing this at anything real.
    bearer_token: nodeva-dev-observability-token
    static_configs:
      - targets: ["host.docker.internal:3100"]
