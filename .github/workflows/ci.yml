name: CI

# Runs the same three suites this project relies on for real verification
# -- backend (real Postgres, no mocked DB), worker (real Docker,
# self-skipping if unavailable), and frontend (Vitest + Testing Library
# component tests, lint, build) -- on every push and pull request. Nothing
# here invents a new testing strategy; it just runs what already exists
# under scripts/e2e_demo.sh and each package's own test script, so a
# regression is caught before merge instead of only when someone
# remembers to run tests locally.
#
# Each job also runs a real dependency vulnerability audit (npm audit /
# pip-audit) before its test suite -- this had never actually been checked
# before (npm audit couldn't even reach the registry in the sandbox this
# was developed in, due to an unrelated local npm misconfiguration; a real
# CI runner has no such problem). Found and fixed one real moderate-severity
# issue (qs, a transitive dependency of express) via an `overrides` entry
# rather than a breaking Express major-version bump.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodeva
          POSTGRES_PASSWORD: nodeva_dev
          POSTGRES_DB: nodeva
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nodeva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # For ws/clusterRelay.test.js -- without this, that file's tests
      # skip (same self-skip pattern as the Postgres-backed suites when the
      # database isn't reachable), so cross-instance routing would never
      # actually run in CI.
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nodeva:nodeva_dev@localhost:5433/nodeva
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-not-a-real-secret-pad-to-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=moderate
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate
      - name: Run backend test suite
        working-directory: backend
        run: npm test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r worker/requirements-dev.txt
      - name: Audit dependencies
        run: pip install pip-audit && pip-audit -r worker/requirements-dev.txt
      - name: Pull the base image used by executor tests
        # Avoids the first real test paying for a cold pull, and makes a
        # registry hiccup fail as a clear, separate step rather than an
        # opaque test timeout.
        run: docker pull alpine:3.20
      - name: Run worker test suite
        run: python -m pytest worker/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend test suite
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # Real-browser proof of the golden path (e2e/run_e2e.sh) -- a real
    # Postgres, backend, Python worker, Vite dev server, and a real
    # Chromium clicking through sign-up/search/reserve/pay/run-a-job.
    # Deliberately does NOT use this workflow's own `services:` postgres
    # pattern (see the other jobs above): run_e2e.sh manages its own
    # Postgres via `docker compose up -d postgres`, exactly as it does for
    # a developer running it locally, so this job runs the SAME script
    # everyone runs on their own machine rather than a CI-only variant of
    # it that could silently drift from what's actually documented in
    # CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install
      - name: Install Playwright's Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Set up the worker's Python environment
        # run_e2e.sh hardcodes .venv/bin/python, matching the path every
        # other script and doc in this repo (README.md's own "Running"
        # section) already uses.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r worker/requirements-dev.txt
          .venv/bin/pip install websockets
      - name: Pull the base image the E2E job actually runs
        run: docker pull alpine:3.20
      - name: Run the real-browser E2E suite
        run: ./e2e/run_e2e.sh
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
