name: CI

# Runs the same three suites this project has relied on for real
# verification throughout its history -- backend (real Postgres, no
# mocked DB), worker (real Docker, self-skipping if unavailable), and
# frontend build+lint -- on every push and pull request. Nothing here
# invents a new testing strategy; it just runs what already exists in
# CLAUDE-session history under scripts/e2e_demo.sh and each package's own
# test script, so a regression is caught before merge instead of only
# when someone remembers to run tests locally.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodeva
          POSTGRES_PASSWORD: nodeva_dev
          POSTGRES_DB: nodeva
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nodeva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nodeva:nodeva_dev@localhost:5433/nodeva
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-not-a-real-secret-pad-to-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Apply migrations
        # No migrate.js exists yet -- this mirrors scripts/e2e_demo.sh's own
        # approach (raw psql against each migration file in order) rather
        # than inventing a second, divergent way to set up the schema.
        run: |
          for f in backend/migrations/*.sql; do
            PGPASSWORD=nodeva_dev psql -h localhost -p 5433 -U nodeva -d nodeva -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run backend test suite
        working-directory: backend
        run: npm test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r worker/requirements-dev.txt
      - name: Pull the base image used by executor tests
        # Avoids the first real test paying for a cold pull, and makes a
        # registry hiccup fail as a clear, separate step rather than an
        # opaque test timeout.
        run: docker pull alpine:3.20
      - name: Run worker test suite
        run: python -m pytest worker/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
