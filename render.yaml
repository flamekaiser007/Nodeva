# Render Blueprint (https://render.com/docs/blueprint-spec) -- deploys the
# two centralized pieces this project actually needs hosted: the backend
# (a real long-running process, not serverless, since it holds persistent
# WebSocket connections to every provider's worker) and the frontend
# (a static build). Postgres is provisioned alongside them.
#
# What this deliberately does NOT deploy: worker/run_worker.py. That runs
# on each PROVIDER's own machine, wherever their GPU physically is -- see
# docs/deployment.md and docs/architecture.md for why that's not a
# deployment target at all, by design.
#
# No payment gateway configured here -- RAZORPAY_KEY_ID/SECRET are left
# unset, so bookings go through the honest no-gateway fallback
# (docs/payment-architecture.md). Add them as real env vars in the Render
# dashboard (never commit real keys to this file) if real payments are
# ever wanted.
databases:
  - name: nodeva-postgres
    plan: free
    databaseName: nodeva
    user: nodeva

services:
  - type: web
    name: nodeva-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # Migrations run on every deploy, before the server starts -- the same
    # migrate.js every other environment (local dev, CI, scripts/e2e_demo.sh)
    # already uses, not a Render-specific migration mechanism.
    startCommand: npm run migrate && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nodeva-postgres
          property: connectionString
      - key: PGSSL
        value: "true" # Render's managed Postgres requires SSL; see db/pool.js
      - key: JWT_SECRET
        generateValue: true # Render generates and stores a real random secret; see docs/secrets-rotation.md if this ever needs rotating
      - key: NODE_ENV
        value: production
      # ADMIN_TOKEN, LOKI_URL, REDIS_URL are all deliberately left unset --
      # every one of them is off-by-default in this codebase (see each
      # feature's own comment: adminToken.js, lokiSink.js, clusterRelay.js)
      # and can be added later in the Render dashboard without a code change.

  - type: web
    name: nodeva-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Vite bakes VITE_API_URL into the built JS at BUILD time, not
      # runtime -- this cannot be a `fromService` reference the way the
      # backend's DATABASE_URL is, because nodeva-backend's own URL isn't
      # known until it's been created once. See docs/deployment.md's
      # step-by-step: deploy the backend first, note its real URL, put it
      # here, then deploy the frontend.
      - key: VITE_API_URL
        value: https://nodeva-backend.onrender.com
    routes:
      # A client-side-routed SPA (App.jsx's own comment: "No client-side
      # router... one extra path is not worth pulling one in" -- but it
      # DOES check window.location.pathname for /reset-password) needs
      # every path to fall through to index.html, or a hard refresh on
      # /reset-password would 404 instead of reaching the app at all.
      - type: rewrite
        source: /*
        destination: /index.html
